{{JSONLD}}<!-- Theme boot, part 1 (21 Oct 2026): runs before any stylesheet can hold the parser. 'rl-boot' switches every
     transition off until the body's boot script has picked the theme, so nothing fades from the markup's dark
     default to a visitor's chosen light (or back). The root colour scheme is set here so the canvas starts right. -->
<script>(function(){var d=document.documentElement;d.classList.add('rl-boot');try{if(localStorage.getItem('rl_theme')==='light'){d.classList.add('rl-pre-light');d.style.colorScheme='light';var m=document.querySelector('meta[name="color-scheme"]');if(m)m.setAttribute('content','light');}}catch(e){}})();</script>
<style>html.rl-boot *,html.rl-boot *::before,html.rl-boot *::after{transition:none!important}html.rl-pre-light body{background:#FFFFFF!important}</style>
