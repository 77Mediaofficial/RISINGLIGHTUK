  <!-- CH. 01 — Reach map. Static blueprint dot-map built from the same LAND
       lat/lon data the old globe used: canvas draws the land dots once, the
       SVG overlay carries the dashed reach arcs + compass, and the location
       nodes are real buttons that open a small info card. No animation loop. -->
  <div class="map-section" id="reach">
    <div class="sect-head">
      <span class="sect-eyebrow">CH. 01 — Our Reach</span>
      <div class="sect-title">Where Compassion Travels</div>
    </div>
    <div class="map-stage" id="map-stage">
      <canvas class="map-dots" id="map-dots" aria-hidden="true"></canvas>
      <svg class="map-overlay" id="map-overlay" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"></svg>
      <!-- node buttons + the shared card are injected by renderMap() -->
      <div class="map-card" id="map-card" role="region" aria-live="polite" hidden></div>
    </div>
    <!-- phones hide the per-marker text chips — this line says how to get them -->
    <div class="map-legend"><span class="map-legend-lead">Tap —</span><button type="button" class="map-legend-btn" onclick="_mapCardShow(0)">London</button>·<button type="button" class="map-legend-btn" onclick="_mapCardShow(1)">Arizona</button>·<button type="button" class="map-legend-btn" onclick="_mapCardShow(2)">Guatemala</button></div>
  </div>
